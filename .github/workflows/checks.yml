name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quest-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: quest/android/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: npm --prefix quest/android ci --ignore-scripts
      - name: Generate the native playback host and immersive launcher
        run: npm --prefix quest/android run generate -- https://blacksnaker.github.io/ "$RUNNER_TEMP/ember-quest-android"
      - name: Android SDK for the Meta immersive package
        run: |
          ember_android_sdk="${ANDROID_HOME:-$RUNNER_TEMP/ember-quest-sdk}"
          ember_sdkmanager="$ember_android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$ember_sdkmanager" ]; then
            mkdir -p "$RUNNER_TEMP/ember-quest-tools" "$ember_android_sdk/cmdline-tools/latest"
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/ember-quest-tools.zip"
            unzip -q "$RUNNER_TEMP/ember-quest-tools.zip" -d "$RUNNER_TEMP/ember-quest-tools"
            cp -a "$RUNNER_TEMP/ember-quest-tools/cmdline-tools/." "$ember_android_sdk/cmdline-tools/latest/"
          fi
          printf 'ANDROID_HOME=%s\n' "$ember_android_sdk" >> "$GITHUB_ENV"
          (yes || true) | "$ember_sdkmanager" --sdk_root="$ember_android_sdk" --licenses > "$RUNNER_TEMP/ember-quest-sdk-licenses.log"
          "$ember_sdkmanager" --sdk_root="$ember_android_sdk" 'platforms;android-32' 'build-tools;35.0.0' > "$RUNNER_TEMP/ember-quest-sdk.log"
      - name: Compile the unsigned APK without publishing signing material
        run: bash "$RUNNER_TEMP/ember-quest-android/gradlew" -p "$RUNNER_TEMP/ember-quest-android" --no-daemon --max-workers=2 assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: ember-quest-unsigned-apk
          path: ${{ runner.temp }}/ember-quest-android/app/build/outputs/apk/release/app-release-unsigned.apk
  quest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: quest/package-lock.json
      - run: npm --prefix quest ci --ignore-scripts
      - run: npm --prefix quest test
      - run: npm --prefix quest run build
      - uses: actions/upload-artifact@v4
        with:
          name: ember-quest-web
          path: quest/dist
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      XDG_SESSION_TYPE: wayland
      XDG_CURRENT_DESKTOP: KDE
      DESKTOP_SESSION: plasmawayland
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Isolate installation folders
        run: |
          printf 'XDG_DATA_HOME=%s/emberbox-installer/data\nXDG_CONFIG_HOME=%s/emberbox-installer/config\nXDG_CACHE_HOME=%s/emberbox-installer/cache\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/emberbox-installer/config" "$RUNNER_TEMP/emberbox-installer/Рабочий стол"
          printf 'XDG_DESKTOP_DIR="%s/emberbox-installer/Рабочий стол"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/emberbox-installer/config/user-dirs.dirs"
      - name: Test display infrastructure
        run: |
          sudo env GITHUB_ACTIONS=true /usr/bin/python3 tools/ci_apt_mirrors.py
          sudo apt-get update -qq
          sudo apt-get install -y xvfb dbus-x11 desktop-file-utils
      - name: Install missing dependencies and desktop integration
        run: ./install.sh --yes --no-systemd --autostart --bin-dir "$RUNNER_TEMP/emberbox-installer/bin"
      - name: Check installed runtime and open GTK widget
        run: |
          ./install.sh --check --plain
          test -x "$RUNNER_TEMP/emberbox-installer/Рабочий стол/emberbox-audio.desktop"
          desktop-file-validate "$RUNNER_TEMP/emberbox-installer/Рабочий стол/emberbox-audio.desktop"
          ember_python=$(/usr/bin/python3 -B -c 'import json,os;from pathlib import Path;print(json.loads((Path(os.environ["XDG_DATA_HOME"])/"emberbox-audio/.emberbox-install.json").read_text())["python"])')
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a "$ember_python" -B tests/gui_smoke.py
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a "$ember_python" -B - <<'PY'
          import os,runpy,sys
          from pathlib import Path
          target=Path(os.environ['XDG_DATA_HOME'])/'emberbox-audio'
          sys.path.insert(0,str(target/'src'))
          import gi
          gi.require_version('Gtk','3.0')
          from gi.repository import Gtk,GLib
          visible=[]
          def finish():
              visible.extend(w for w in Gtk.Window.list_toplevels() if w.get_visible())
              Gtk.main_quit()
              return False
          GLib.timeout_add(2000,finish)
          runpy.run_path(str(target/'src/widget.py'),run_name='__main__')
          assert visible,'Installed widget did not appear'
          print('Installed widget opened successfully')
          PY
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: System dependencies
        run: |
          sudo env GITHUB_ACTIONS=true /usr/bin/python3 tools/ci_apt_mirrors.py
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 python3-numpy python3-scipy python3-pil python3-websocket python3-mpv mpv ffmpeg dbus-x11 xvfb nodejs libgl1 libgl1-mesa-dri libegl1 libegl-mesa0
      - name: Compile
        run: /usr/bin/python3 -m compileall -q src tools tests
      - name: Regression checks
        run: /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: MPRIS source routing
        run: |
          dbus-run-session -- /usr/bin/python3 tests/mpris_smoke.py
          dbus-run-session -- /usr/bin/python3 tests/widget_control_smoke.py
      - name: Responsive cold startup
        run: GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/loading_smoke.py
      - name: Apple and Yandex Music adapters
        run: |
          node tests/spotify_web_test.js
          node tests/favorites_web_test.js
          node tests/apple_web_test.js
          node tests/apple_browser_test.js
          node tests/yandex_web_test.js
          node tests/web_host_test.js
          node tests/artist_web_test.js
          node tests/yandex_artist_test.js
          node tests/media_quality_test.js
          node tests/spatial_source_test.js
          node tests/spatial_playback_test.cjs
          node tests/flow_engine_checks.cjs
          node tests/flow_eq_checks.cjs
          node tests/waveform_engine_checks.cjs
          node tests/scene_test.cjs
      - name: Headphone voicing and small-screen controls
        run: |
          GDK_BACKEND=x11 LANGUAGE=en dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/headphone_smoke.py
          GDK_BACKEND=x11 LANGUAGE=ru dbus-run-session -- xvfb-run -a -s '-screen 0 1024x600x24' /usr/bin/python3 tests/headphone_smoke.py
      - name: GTK layout and controls
        run: GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/gui_smoke.py
      - name: Liquid Glass menus, Mini anchors and independent source sessions
        run: |
          EMBERBOX_LANGUAGE=en GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1024x600x24' /usr/bin/python3 tests/menu_glass_smoke.py
          EMBERBOX_LANGUAGE=ru GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1024x600x24' /usr/bin/python3 tests/menu_glass_smoke.py
          GDK_SCALE=2 EMBERBOX_LANGUAGE=ru GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/menu_glass_smoke.py
      - name: Winter theme, persistence and responsive controls
        run: |
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/winter_theme_smoke.py
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/winter_snow_smoke.py
      - name: Cached winter materials, pixels and live children
        run: |
          GDK_BACKEND=x11 GDK_SCALE=1 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/winter_material_smoke.py
          GDK_BACKEND=x11 GDK_SCALE=2 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/winter_material_smoke.py
      - name: Nocturne charcoal theme, live settings and seasonal cleanup
        run: |
          EMBERBOX_LANGUAGE=en GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/night_theme_smoke.py
          EMBERBOX_LANGUAGE=ru GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/night_theme_smoke.py
      - name: Velvet Jazz, finite cover light and compact materials
        run: |
          EMBERBOX_LANGUAGE=en GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/velvet_theme_smoke.py
          EMBERBOX_LANGUAGE=ru GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/velvet_theme_smoke.py
          EMBERBOX_LANGUAGE=ru GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/psychedelic_theme_smoke.py
      - name: Favourites and finite heart motion
        run: GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/favorites_smoke.py
      - name: Mirrorball glass, theme selection and bounded optical motion
        run: |
          GDK_SCALE=1 LIBGL_ALWAYS_SOFTWARE=1 GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/mirror_pan_gl_smoke.py
          EMBERBOX_LANGUAGE=en GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/mirror_theme_smoke.py
          EMBERBOX_LANGUAGE=ru GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/mirror_theme_smoke.py
      - name: Fullscreen listening room
        run: GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/fullscreen_smoke.py
      - name: Liquid cover transitions and playback readiness
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          GDK_BACKEND: x11
        run: |
          GDK_SCALE=1 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/ripple_gl_smoke.py
          GDK_SCALE=1 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/cover_ripple_smoke.py
          GDK_SCALE=2 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/cover_ripple_smoke.py
          GDK_SCALE=1 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/cover_change_smoke.py
          GDK_SCALE=1 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/cover_pause_smoke.py
          GDK_SCALE=2 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/cover_pause_smoke.py
      - name: Karaoke timing, layout and lifecycle
        run: |
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/karaoke_smoke.py
          EMBERBOX_LANGUAGE=ru GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/karaoke_smoke.py
      - name: Mashup studio, recipes and isolated audio
        run: |
          /usr/bin/python3 tests/mashup_worker_smoke.py
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/mashup_smoke.py
          EMBERBOX_LANGUAGE=ru GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/mashup_smoke.py
      - name: Fullscreen shader and offscreen room
        run: |
          GDK_SCALE=1 LIBGL_ALWAYS_SOFTWARE=1 GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/reveal_backdrop_smoke.py
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/header_glass_smoke.py
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/page_transition_smoke.py
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1280x720x24' /usr/bin/python3 tests/reveal_smoke.py
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1280x720x24' /usr/bin/python3 tests/theme_reveal_smoke.py
          EMBERBOX_REVEAL_TEST_GL=1 GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1280x720x24' /usr/bin/python3 tests/theme_reveal_smoke.py
      - name: Fullscreen collection and listening queue
        run: GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/library_smoke.py
      - name: Playlist transition desk, physical controls and saved recipes
        run: |
          EMBERBOX_LANGUAGE=en GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/flow_editor_smoke.py
          EMBERBOX_LANGUAGE=ru GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/flow_editor_smoke.py
      - name: Readable record lists and independent controls
        run: |
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/record_list_smoke.py
          EMBERBOX_LANGUAGE=ru GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/record_list_smoke.py
      - name: Artist room, releases and source changes
        run: |
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/artist_glass_smoke.py
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/artist_smoke.py
          EMBERBOX_LANGUAGE=ru GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/artist_smoke.py
      - name: Editorial reading, Russian translation and responsive offline failures
        run: |
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/editorial_reader_smoke.py
          EMBERBOX_LANGUAGE=ru GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/editorial_reader_smoke.py
      - name: Album room, artwork and finite entrance
        run: |
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/test_album_header.py
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/album_opening_smoke.py
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/album_room_smoke.py
          EMBERBOX_LANGUAGE=ru GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/album_room_smoke.py
      - name: Artist entrance, GPU layers and cancellation
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/artist_reveal_smoke.py
          EMBERBOX_LANGUAGE=ru LIBGL_ALWAYS_SOFTWARE=1 GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/artist_reveal_smoke.py
      - name: Complete discography and interrupted scans
        run: |
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/discography_smoke.py
          EMBERBOX_LANGUAGE=ru GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/discography_smoke.py
      - name: Personal DJ, keyboard and voice routing
        run: |
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/dj_smoke.py
          EMBERBOX_LANGUAGE=ru GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/dj_smoke.py
      - name: Audio quality badge
        run: GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' /usr/bin/python3 tests/quality_smoke.py
      - name: Listening scene card and finite motion
        run: |
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/scene_smoke.py
          EMBERBOX_LANGUAGE=ru GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/scene_smoke.py
      - name: Silent motion artwork
        run: GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/motion_smoke.py
